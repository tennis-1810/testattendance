<!DOCTYPE html>
<html>
<head>
  <title>Nadal Education and Tennis School - ASA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #418EDE, #E55527);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:15px;
      box-sizing:border-box;
    }

    .card {
      background:white;
      padding:25px 20px 30px 20px;
      border-radius:18px;
      width:100%;
      max-width:380px;
      box-shadow:0 15px 30px rgba(0,0,0,0.2);
      text-align:center;
    }

    .logo {
      display:block;
      margin:0 auto 18px auto;
      width:110px;
      height:auto;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.2));
    }

    h2 {
      color:#418EDE;
      margin-bottom:20px;
      font-size:20px;
      line-height:1.3;
    }

    input, select, textarea {
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #ddd;
      font-size:14px;
      box-sizing:border-box;
    }

    [hidden] { display:none !important; }
    textarea { font-family:inherit; resize:vertical; }

    video {
      width:100%;
      border-radius:12px;
      margin-top:15px;
      border:3px solid #418EDE;
    }

    .btn {
      width:100%;
      padding:14px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
      transition:0.3s;
    }

    .btn:disabled {
      opacity:0.55;
      cursor:not-allowed;
    }

    .clockin {
      background:#418EDE;
      color:white;
    }

    .clockin:hover {
      background:#2f6fb8;
    }

    .clockout {
      background:#E55527;
      color:white;
    }

    .clockout:hover {
      background:#c7431b;
    }

    .footer {
      margin-top:20px;
      font-size:12px;
      color:#888;
    }
  </style>
</head>

<body>

<div class="card">

  <img src="https://i.postimg.cc/wvfp7rfw/Logo-ENG-negro-(1).png" class="logo">

  <h2>Nadal Education and Tennis School - ASA</h2>

  <input type="text" id="name" placeholder="Employee Name">

  <select id="area">
    <option>Anantapur</option>
    <option value="Leave">Leave</option>
  </select>

  <div id="leaveFields" hidden>
    <label for="leaveDateChoice">Leave date</label>
    <select id="leaveDateChoice">
      <option value="today">Today</option>
      <option value="custom">Choose another date</option>
    </select>
    <div id="customDateFields" hidden>
      <label for="leaveStartDate">Leave start date</label>
      <input type="date" id="leaveStartDate">
      <label for="leaveEndDate">Leave end date</label>
      <input type="date" id="leaveEndDate">
    </div>
  </div>

  <!-- Session -->
  <select id="session">
    <option value="">Select Session</option>
    <option>Morning</option>
    <option>Evening</option>
    <option id="fullDayOption" value="Full Day" hidden disabled>Full Day</option>
  </select>

  <div id="leaveSummary" hidden>
    <label for="reportingDate">Reporting date (automatic)</label>
    <input type="text" id="reportingDate" readonly aria-readonly="true">
    <label for="totalLeaveDays">Total leave days (Sundays excluded)</label>
    <input type="text" id="totalLeaveDays" readonly aria-readonly="true">
    <p style="font-size:12px;color:#666">Morning or Evening counts as 0.5 day per eligible date. Full Day counts as 1 day. Reporting is the next calendar day after leave ends.</p>
  </div>
  <div id="leaveReasonFields" hidden>
    <label for="reason">Reason for leave</label>
    <textarea id="reason" rows="3" maxlength="1000" placeholder="Enter reason for leave"></textarea>
  </div>

  <button type="button" class="btn" id="enableCamera">Enable Camera</button>
  <video id="video" autoplay playsinline muted hidden></video>

  <button class="btn clockin" onclick="clock('Clock In')">Clock In</button>
  <button class="btn clockout" onclick="clock('Clock Out')">Clock Out</button>

  <button type="button" class="btn clockin" id="submitLeave" onclick="clock('Leave')" hidden>Submit Leave</button>
  <p id="status" role="status" aria-live="polite"></p>

  <div class="footer">
    NETS-ASA Attendance System
  </div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbz9eODq2buLCJO7Fo8X4z450KE2U5WA2cwauh0K3zEDi5hsuQV3omfZC2-_ue-EHIeMvQ/exec";
const video = document.getElementById("video");
const areaSelect = document.getElementById("area");
const cameraButton = document.getElementById("enableCamera");
const leaveButton = document.getElementById("submitLeave");
const clockButtons = Array.from(document.querySelectorAll("button[onclick]"));
const attendanceButtons = clockButtons.filter(button => button !== leaveButton);
const statusMessage = document.getElementById("status");
const dateChoice = document.getElementById("leaveDateChoice");
const startDateInput = document.getElementById("leaveStartDate");
const endDateInput = document.getElementById("leaveEndDate");
const sessionSelect = document.getElementById("session");
// Calendar arithmetic uses UTC to keep date-only values independent of device timezone.
function parseLeaveDate(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  const date = new Date(value + "T00:00:00.000Z");
  return Number.isFinite(date.getTime()) && date.getUTCFullYear() >= 1 &&
    date.toISOString().slice(0, 10) === value ? date : null;
}
function calculateLeave(startValue, endValue, session) {
  const start = parseLeaveDate(startValue);
  const end = parseLeaveDate(endValue);
  if (!start || !end) throw new Error("Select valid leave start and end dates.");
  if (end < start) throw new Error("Leave end date cannot be before the start date.");
  if (!["Morning", "Evening", "Full Day"].includes(session)) {
    throw new Error("Select Morning, Evening, or Full Day.");
  }
  const days = Math.round((end - start) / 86400000) + 1;
  let sundays = Math.floor(days / 7);
  for (let offset = 0; offset < days % 7; offset++) {
    if ((start.getUTCDay() + offset) % 7 === 0) sundays++;
  }
  const eligibleDays = days - sundays;
  const reporting = new Date(end.getTime() + 86400000);
  if (reporting.getUTCFullYear() > 9999) throw new Error("Choose an earlier leave end date.");
  return {
    startDate:startValue,
    endDate:endValue,
    reportingDate:reporting.toISOString().slice(0, 10),
    totalDays:eligibleDays * (session === "Full Day" ? 1 : 0.5)
  };
}
function displayLeaveDate(value) {
  return value.split("-").reverse().join("-");
}

function todayIST() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const value = type => parts.find(part => part.type === type).value;
  return value("year") + "-" + value("month") + "-" + value("day");
}
function selectedLeaveDates() {
  const today = todayIST();
  return dateChoice.value === "today"
    ? { start:today, end:today }
    : { start:startDateInput.value, end:endDateInput.value };
}
function updateLeaveSummary() {
  document.getElementById("reportingDate").value = "";
  document.getElementById("totalLeaveDays").value = "";
  const dates = selectedLeaveDates();
  const parsedEnd = parseLeaveDate(dates.end);
  if (parsedEnd && parsedEnd.getUTCFullYear() < 9999) {
    const reporting = new Date(parsedEnd.getTime() + 86400000).toISOString().slice(0, 10);
    document.getElementById("reportingDate").value = displayLeaveDate(reporting);
  }
  try {
    const details = calculateLeave(dates.start, dates.end, sessionSelect.value);
    document.getElementById("totalLeaveDays").value = String(details.totalDays);
  } catch { /* Incomplete or invalid dates are validated on submission. */ }
}
function updateDateChoice() {
  const custom = dateChoice.value === "custom";
  document.getElementById("customDateFields").hidden = !custom;
  startDateInput.required = endDateInput.required = areaSelect.value === "Leave" && custom;
  if (custom && !startDateInput.value) startDateInput.value = todayIST();
  if (custom && !endDateInput.value) endDateInput.value = startDateInput.value;
  endDateInput.min = startDateInput.value;
  updateLeaveSummary();
}
dateChoice.addEventListener("change",updateDateChoice);
startDateInput.addEventListener("change",() => {
  if (!endDateInput.value || endDateInput.value < startDateInput.value) {
    endDateInput.value = startDateInput.value;
  }
  endDateInput.min = startDateInput.value;
  updateLeaveSummary();
});
endDateInput.addEventListener("change",updateLeaveSummary);
sessionSelect.addEventListener("change",updateLeaveSummary);
let attendanceSubmitting = false;
let cameraStarting = false;

function updateMode() {
  const leave = areaSelect.value === "Leave";
  document.getElementById("leaveFields").hidden = !leave;
  document.getElementById("leaveReasonFields").hidden = !leave;
  document.getElementById("leaveSummary").hidden = !leave;
  document.getElementById("fullDayOption").hidden = !leave;
  document.getElementById("fullDayOption").disabled = !leave;
  if (!leave && sessionSelect.value === "Full Day") sessionSelect.value = "";
  updateDateChoice();
  document.getElementById("reason").required = leave;
  leaveButton.hidden = !leave;
  attendanceButtons.forEach(button => { button.hidden = leave; });
  if (leave && video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
  video.hidden = leave || !video.srcObject;
  cameraButton.hidden = leave || !!video.srcObject;
  statusMessage.textContent = leave
    ? "Choose a leave date and session, enter a reason, and submit."
    : "Enable the camera before recording attendance.";
}

async function startCamera() {
  if (cameraStarting || areaSelect.value === "Leave") return;
  cameraStarting = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
    if (areaSelect.value === "Leave") {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    video.srcObject = stream;
    video.hidden = false;
    cameraButton.hidden = true;
    await video.play();
    statusMessage.textContent = "Camera ready.";
  } catch {
    statusMessage.textContent = "Camera permission required for attendance. Allow access and try again.";
  } finally {
    cameraStarting = false;
  }
}

function getLocation() {
  return new Promise((resolve,reject) => {
    if (!navigator.geolocation) { reject(new Error("Location unavailable")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude }),
      reject,
      { enableHighAccuracy:true, timeout:20000 }
    );
  });
}

function capturePhoto(type,location) {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(video,0,0);

  const now = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });

  // Watermark background
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, canvas.height - 140, canvas.width, 140);

  // Watermark text
  ctx.fillStyle = "white";
  ctx.font = "26px Arial";
  ctx.fillText("Nadal Education and Tennis School - ASA", 20, canvas.height - 100);
  ctx.fillText("Lat: " + location.lat.toFixed(6), 20, canvas.height - 70);
  ctx.fillText("Lng: " + location.lng.toFixed(6), 20, canvas.height - 40);
  ctx.fillText("Time: " + now, 20, canvas.height - 10);
  ctx.fillText("Type: " + type, canvas.width - 200, canvas.height - 10);

  const photo = canvas.toDataURL("image/jpeg", 0.8).split(',')[1];


  return photo;
}

async function clock(type) {
  if (attendanceSubmitting) return;
  const name = document.getElementById("name").value.trim();
  const area = areaSelect.value;
  const session = document.getElementById("session").value;
  const isLeave = area === "Leave";
  const reason = document.getElementById("reason").value.trim();
  if (!name) { alert("Enter employee name"); return; }
  if (!session) { alert("Select session"); return; }
  let leaveDetails;
  if (isLeave) {
    try {
      const dates = selectedLeaveDates();
      leaveDetails = calculateLeave(dates.start, dates.end, session);
      if (leaveDetails.totalDays === 0) {
        alert("Sundays are excluded. Select at least one non-Sunday date.");
        return;
      }
    } catch (error) { alert(error.message); return; }
  }
  if (isLeave && !reason) { alert("Enter reason for leave"); return; }
  if (!isLeave && (!video.videoWidth || !video.videoHeight || !video.srcObject)) {
    alert("Enable the camera and wait for the preview before recording attendance.");
    return;
  }
  const activeButton = isLeave ? leaveButton : attendanceButtons[type === "Clock In" ? 0 : 1];
  const originalLabels = clockButtons.map(button => button.textContent);
  attendanceSubmitting = true;
  clockButtons.forEach(button => { button.disabled = true; });
  document.querySelectorAll("input,select,textarea").forEach(field => { field.disabled = true; });
  let requestStarted = false;
  try {
    let payload;
    if (isLeave) {
      payload = { name,area,type:"Leave",session,reason,
        leaveStartDate:leaveDetails.startDate, leaveEndDate:leaveDetails.endDate };
    } else {
      activeButton.textContent = "Getting location…";
      let location;
      try { location = await getLocation(); }
      catch { alert("Location permission required. Check location services and try again."); return; }
      const photo = capturePhoto(type,location);
      payload = { name,area,type,session,lat:location.lat,lng:location.lng,photo };
    }
    activeButton.textContent = isLeave ? "Submitting leave…" : "Registering attendance…";
    requestStarted = true;
    const response = await fetch(scriptURL,{
      method:"POST",
      body:JSON.stringify(payload)
    });
    if (!response.ok) throw new Error("Server error");
    const message = await response.text();
    statusMessage.textContent = message;
    alert(message);
  } catch {
    const message = requestStarted
      ? "Could not confirm whether your entry was saved. Please check with the administrator before submitting again."
      : "Unable to capture attendance. Check the camera and try again.";
    statusMessage.textContent = message;
    alert(message);
  } finally {
    attendanceSubmitting = false;
    clockButtons.forEach((button,index) => {
      button.disabled = false;
      button.textContent = originalLabels[index];
    });
    document.querySelectorAll("input,select,textarea").forEach(field => { field.disabled = false; });
    document.getElementById("fullDayOption").disabled = areaSelect.value !== "Leave";
  }
}
areaSelect.addEventListener("change",updateMode);
cameraButton.addEventListener("click",startCamera);
updateMode();
</script>

</body>
</html>
